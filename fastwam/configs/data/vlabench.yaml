train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/vlabench/vlabench_primitive_ft_lerobot_video
    - ./data/vlabench/vlabench_composite_ft_lerobot_video
  shape_meta:
    images:
      - key: observation.images.image
        raw_shape: [3, 480, 480]
        shape: [3, 224, 224]
      - key: observation.images.second_image
        raw_shape: [3, 480, 480]
        shape: [3, 224, 224]
      - key: observation.images.wrist_image
        raw_shape: [3, 480, 480]
        shape: [3, 224, 224]
    action:
      - key: action
        raw_shape: 7
        shape: 7
    state:
      - key: observation.state
        raw_shape: 7
        shape: 7
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 672]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 7
    proprio_output_dim: 7
    delta_action_dim_mask:
      action: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/vlabench
  context_len: 128
  ledger_annotations_path: null
  ledger_num_claims: 8
  ledger_num_entities: 8
  ledger_num_repair_actions: 4
  ledger_strict_coverage: true
  ledger_auto_annotate: true
  ledger_temporal_steps: 4
