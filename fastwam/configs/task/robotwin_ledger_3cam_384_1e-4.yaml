# @package _global_

defaults:
  - override /data: robotwin
  - override /model: ledger_wam
  - _self_

batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  planner:
    task_execution_horizon: 24

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
